<svg width="640" height="640" viewBox="0 0 640 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="640" rx="72" fill="#141006"/>
  <circle cx="320" cy="330" r="215" fill="url(#halo)" fill-opacity="0.3"/>
  <!-- Spotlight: C rendered as a beam of light sweeping from a source, cinematic and premium -->
  <!-- the beam cone -->
  <path d="M180 150L470 250L470 390L180 490Z" fill="url(#beam)" fill-opacity="0.18"/>
  <!-- the C as the lit edge -->
  <path d="M452 200C416 162 368 140 314 140C208 140 122 226 122 332C122 438 208 524 314 524C368 524 416 502 452 464L418 426C390 458 354 476 314 476C234 476 170 412 170 332C170 252 234 188 314 188C354 188 390 206 418 238L452 200Z" fill="url(#gold)"/>
  <!-- bright source point -->
  <circle cx="180" cy="150" r="16" fill="url(#src)"/>
  <circle cx="180" cy="150" r="34" fill="url(#srcGlow)" fill-opacity="0.4"/>
  <!-- light streaks -->
  <path d="M150 300L118 300M156 332L112 332M150 364L124 364" stroke="#FFE9B8" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>
  <defs>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 330) rotate(90) scale(240)">
      <stop stop-color="#F5C04E"/><stop offset="1" stop-color="#F5C04E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="180" y1="150" x2="470" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE9B8"/><stop offset="1" stop-color="#F5C04E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="122" y1="140" x2="452" y2="524" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE08A"/><stop offset="0.5" stop-color="#F5C04E"/><stop offset="1" stop-color="#D98A2B"/>
    </linearGradient>
    <radialGradient id="src" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 150) rotate(90) scale(16)">
      <stop stop-color="#FFF4D6"/><stop offset="1" stop-color="#F5C04E"/>
    </radialGradient>
    <radialGradient id="srcGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 150) rotate(90) scale(34)">
      <stop stop-color="#FFE9B8"/><stop offset="1" stop-color="#FFE9B8" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
