<svg width="640" height="640" viewBox="0 0 640 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="640" rx="72" fill="#141006"/>
  <circle cx="320" cy="320" r="215" fill="url(#halo)" fill-opacity="0.28"/>
  <!-- Signet: C engraved as a wax-seal / signet ring, concentric rings + monogram C -->
  <circle cx="320" cy="320" r="200" fill="url(#seal)" fill-opacity="0.12"/>
  <circle cx="320" cy="320" r="200" fill="none" stroke="url(#ring1)" stroke-width="3"/>
  <circle cx="320" cy="320" r="168" fill="none" stroke="url(#ring1)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- central C -->
  <path d="M404 250C382 226 352 212 320 212C260 212 212 260 212 320C212 380 260 428 320 428C352 428 382 414 404 390L382 366C366 384 344 394 320 394C279 394 246 361 246 320C246 279 279 246 320 246C344 246 366 256 382 274L404 250Z" fill="url(#gold)"/>
  <!-- engraved tick marks around inner ring -->
  <g stroke="#F5C04E" stroke-opacity="0.5" stroke-width="2">
    <path d="M320 152V168M320 472V488M152 320H168M472 320H488"/>
    <path d="M201 201L212 212M428 428L439 439M439 201L428 212M212 428L201 439"/>
  </g>
  <defs>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 320) rotate(90) scale(240)">
      <stop stop-color="#F5C04E"/><stop offset="1" stop-color="#F5C04E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="seal" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 320) rotate(90) scale(200)">
      <stop stop-color="#F5C04E"/><stop offset="1" stop-color="#D98A2B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring1" x1="120" y1="120" x2="520" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE08A"/><stop offset="1" stop-color="#D98A2B"/>
    </linearGradient>
    <linearGradient id="gold" x1="212" y1="212" x2="404" y2="428" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE9B8"/><stop offset="1" stop-color="#E8A24A"/>
    </linearGradient>
  </defs>
</svg>
