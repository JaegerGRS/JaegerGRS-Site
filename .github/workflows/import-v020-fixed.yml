name: Sync published portfolio source
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-v020-fixed.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the validated v0.2.0 release
        run: |
          curl -fL --retry 3 https://jaegergrs-portfolio.imjaethetech.workers.dev/_source/jaegergrs-v0.2.0.zip -o /tmp/site.zip
          unzip -q /tmp/site.zip -d /tmp/site
          test -s /tmp/site/jaegergrs-v0.2.0/projects/grey-signal/index.html
      - name: Publish the source to GitHub
        run: |
          cp -a /tmp/site/jaegergrs-v0.2.0/. .
          rm -f changelog.html assets/main.js assets/styles.css
          git restore --source=HEAD -- .github/workflows/cloudflare-deploy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: add multi-page JaegerGRS v0.2.0"
          git push origin HEAD:main
