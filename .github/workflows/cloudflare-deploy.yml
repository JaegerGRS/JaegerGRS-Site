name: Cloudflare — validate and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate Cloudflare Worker
        run:  ode scripts/build-worker.mjs
      - name: Validate generated Worker
        run: |
          node --check dist/worker.mjs
          test -s index.html
          test -s changelog.html
          test -s sitemap.xml
          test -s robots.txt
          test -s assets/styles.css
          test -s assets/main.js
  deploy:
    needs: validate
    if: ${{ github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run:  ode scripts/build-worker.mjs
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
